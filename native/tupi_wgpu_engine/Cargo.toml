[package]
name = "tupi_wgpu_engine"
version = "0.1.0"
edition = "2021"
authors = ["TupiLingo Graphics Engineering Team"]
description = "High-Performance WGPU Isometric Engine for Pindorama Historical Map"

[lib]
name = "tupi_wgpu_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = "0.25"
bytemuck = { version = "1.14", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.8"
ndk-sys = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
