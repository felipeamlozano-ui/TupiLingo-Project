# fly.toml app configuration file generated for quiet-surf-9903 on 2026-11-03T21:35:40-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quiet-surf-9903'
primary_region = 'gru'

[build]
  dockerfile = 'docker/django/Dockerfile.prod'

[env]
  DJANGO_SETTINGS_MODULE = 'config.settings.production'
  PRODUCTION = 'True'
  DEBUG = 'False'
  PORT = '8000'
  SKIP_MIGRATIONS = 'true'
  DB_CONN_MAX_AGE = '0'
  ENABLE_PROMPT_CACHE = 'false'
  ENABLE_CELERY = 'false'
  ENABLE_OTEL = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
