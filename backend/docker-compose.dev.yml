  #     - OLLAMA_API_BASE=http://host.docker.internal:11434
  #   volumes:
  #     - .:/app
  #     - huggingface_cache:/root/.cache/huggingface
  #   entrypoint: []
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     - redis
  #     - django

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - tupilingo_net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
