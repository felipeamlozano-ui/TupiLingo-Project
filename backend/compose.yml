services:
  # ==========================================
  # Aplicação Principal (Django)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    image: tupilingo-backend:dev
    container_name: tupilingo_backend
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - PROMETHEUS_MULTIPROC_DIR=/tmp/metrics
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - tupilingo_net
    profiles: ["dev"]

  # ==========================================
  # Background Workers (Celery)
  # ==========================================
  celery_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    container_name: tupilingo_celery
    command: ["celery", "-A", "config", "worker", "-l", "INFO"]
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - tupilingo_net
    profiles: ["dev"]

  # ==========================================
  # Infraestrutura de Dados e Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: tupilingo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tupilingo_net
    profiles: ["dev", "prod"]

  chromadb:
    image: chromadb/chroma:latest
    container_name: tupilingo_chroma
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - tupilingo_net
    profiles: ["dev", "prod"]

  # Opcional: Banco de dados local para dev (Se não usar Supabase)
  postgres:
    image: postgres:15-alpine
    container_name: tupilingo_postgres
    environment:
      POSTGRES_DB: tupilingo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tupilingo_net
    profiles: ["local_db"]

  # ==========================================
  # Observabilidade (Grafana & Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tupilingo_prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - tupilingo_net
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    container_name: tupilingo_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - tupilingo_net
    profiles: ["observability"]

networks:
  tupilingo_net:
    driver: bridge

volumes:
  static_volume:
  media_volume:
  postgres_data:
  redis_data:
  chroma_data:
  prometheus_data:
  grafana_data:
