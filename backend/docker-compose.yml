# =============================================================
# docker-compose.yml — TupiLingo Backend (BASE)
# Contém definições compartilhadas entre dev e produção.
# NÃO use este arquivo diretamente — use os overrides:
#   Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================

services:
  # ---- Django / Gunicorn ----
  django:
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - vector_db_data:/app/vector_store.db    # Banco vetorial SQLite persistente
      - pdfs_data:/app/pdfs                    # PDFs para ingestão
      - static_files:/app/staticfiles          # Estáticos coletados
      - media_files:/app/media                 # Uploads de mídia
      - huggingface_cache:/root/.cache/huggingface  # Modelo all-MiniLM-L6-v2 cacheado
    networks:
      - tupilingo_net
    depends_on:
      - nginx

  # ---- PDF Worker (ingestão) ----
  pdf_worker:
    restart: on-failure   # Termina após processar; reinicia apenas em caso de erro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - vector_db_data:/app/vector_store.db
      - pdfs_data:/app/pdfs
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - tupilingo_net

  # ---- Nginx (reverse proxy) ----
  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_files:/app/staticfiles:ro     # Read-only: só lê o que Django gerou
      - media_files:/app/media:ro
    networks:
      - tupilingo_net

# ---- Volumes persistentes ----
volumes:
  vector_db_data:
    driver: local
  pdfs_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  huggingface_cache:
    driver: local

# ---- Rede interna isolada ----
networks:
  tupilingo_net:
    driver: bridge
