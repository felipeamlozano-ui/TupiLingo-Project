# =============================================================
# docker-compose.tunnel.yml — TupiLingo Backend (PRODUÇÃO LOCAL / TÚNEL)
# Override para simular ambiente de produção 100% real com túnel HTTPS.
#
# Executa:
#   - Django sob Gunicorn (WSGI de Produção com 2 workers/2 threads para 7.3GB RAM)
#   - DJANGO_SETTINGS_MODULE=config.settings.production (DEBUG=False)
#   - Redis para cache/filas
#   - Porta 8000 exposta no host para o túnel HTTPS (Ngrok / Cloudflare)
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up django redis
# =============================================================

services:
  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    entrypoint: []
    command: >
      bash -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput --clear &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120 --access-logfile - --error-logfile -"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DEBUG=False
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_API_BASE=http://host.docker.internal:11434
    volumes:
      - .:/app
      - ./pdfs:/app/pdfs
      - huggingface_cache:/root/.cache/huggingface
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - tupilingo_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - tupilingo_net

  # Declarações para satisfazer o docker-compose.yml base sem subir se não solicitado
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

  pdf_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev

  vocab_worker:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
