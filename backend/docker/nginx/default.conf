# =============================================================
# default.conf — Virtual host TupiLingo
# Nginx faz proxy para Gunicorn e serve arquivos estáticos diretamente
# =============================================================

server {
    listen 80;
    server_name _;   # Aceita qualquer hostname (configurar domínio em produção)

    # Usa o resolver de DNS interno do Docker para resolver nomes de container dinamicamente.
    # Isso evita que o Nginx quebre na inicialização se o Django ainda não estiver de pé.
    resolver 127.0.0.11 valid=5s;

    # Headers de segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos estáticos do Django (collectstatic) — Nginx serve diretamente
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Arquivos de mídia
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API Django — proxy para Gunicorn (com resolução dinâmica via variável)
    location / {
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para geração de questões via IA
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    # Bloqueia acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
