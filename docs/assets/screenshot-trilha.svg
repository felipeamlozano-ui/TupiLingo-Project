<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="goldButton" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Screen -->
  <rect width="380" height="780" fill="#F4F8F4" />

  <!-- Top App Bar -->
  <rect width="380" height="95" fill="url(#headerGrad)" />
  
  <!-- Status Items (Streak, Conchas, Vidas) -->
  <g transform="translate(20, 48)">
    <!-- Streak -->
    <rect x="0" y="0" width="90" height="34" rx="17" fill="rgba(255,255,255,0.18)" />
    <text x="14" y="23" font-size="16">🔥</text>
    <text x="36" y="23" fill="#FFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">7 dias</text>

    <!-- Conchas -->
    <rect x="100" y="0" width="105" height="34" rx="17" fill="rgba(255,255,255,0.18)" />
    <text x="112" y="22" font-size="16">🐚</text>
    <text x="134" y="23" fill="#FFE082" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">420</text>

    <!-- Vidas -->
    <rect x="215" y="0" width="65" height="34" rx="17" fill="rgba(255,255,255,0.18)" />
    <text x="227" y="23" font-size="16">❤️</text>
    <text x="249" y="23" fill="#FFCDD2" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">5</text>

    <!-- Som/Settings -->
    <circle cx="325" cy="17" r="17" fill="rgba(255,255,255,0.18)" />
    <text x="317" y="23" font-size="15">🔊</text>
  </g>

  <!-- Chapter Banner -->
  <g transform="translate(20, 115)">
    <rect width="340" height="75" rx="18" fill="#FFFFFF" stroke="#E0E6E0" stroke-width="1.5" filter="url(#nodeShadow)" />
    <rect x="0" y="0" width="8" height="75" rx="4" fill="#2E7D32" />
    <text x="24" y="32" fill="#2E7D32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="1">MÓDULO 1 • CAPÍTULO 1</text>
    <text x="24" y="55" fill="#1A2E1C" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17">Saudações e Origens</text>
    <circle cx="305" cy="38" r="18" fill="#E8F5E9" />
    <text x="296" y="44" font-size="16">🌿</text>
  </g>

  <!-- Curved Trail (Path) -->
  <path d="M 190 220 C 120 270, 90 310, 130 380 C 170 450, 290 470, 250 560 C 210 650, 150 670, 190 730" 
        fill="none" stroke="#C8E6C9" stroke-width="12" stroke-linecap="round" stroke-dasharray="10 8" />

  <!-- Trail Node 1 (Completed) -->
  <g transform="translate(190, 225)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="34" fill="#2E7D32" stroke="#1B5E20" stroke-width="3" />
    <circle cx="0" cy="0" r="28" fill="#4CAF50" />
    <text x="-12" y="8" font-size="22">✓</text>
    <!-- Stars below -->
    <text x="-20" y="46" font-size="12">⭐⭐⭐</text>
  </g>

  <!-- Trail Node 2 (Active with Aura) -->
  <g transform="translate(125, 365)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="44" fill="rgba(255, 179, 0, 0.25)" />
    <circle cx="0" cy="0" r="36" fill="#FFA000" stroke="#FF8F00" stroke-width="4" />
    <circle cx="0" cy="0" r="30" fill="url(#goldButton)" />
    <text x="-12" y="8" font-size="24">🏹</text>
    <!-- Animated Callout tooltip -->
    <g transform="translate(0, -56)">
      <rect x="-42" y="0" width="84" height="28" rx="14" fill="#2E7D32" />
      <polygon points="0,32 -6,28 6,28" fill="#2E7D32" />
      <text x="-26" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11">JOGAR!</text>
    </g>
  </g>

  <!-- Trail Node 3 (Locked) -->
  <g transform="translate(255, 520)" filter="url(#nodeShadow)">
    <circle cx="0" cy="0" r="32" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="3" />
    <circle cx="0" cy="0" r="26" fill="#E0E0E0" />
    <text x="-9" y="8" font-size="18">🔒</text>
  </g>

  <!-- Trail Node 4 (Chest Reward) -->
  <g transform="translate(180, 680)" filter="url(#nodeShadow)">
    <rect x="-28" y="-28" width="56" height="56" rx="18" fill="#FFB300" stroke="#FF8F00" stroke-width="3" />
    <text x="-14" y="10" font-size="26">🎁</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 715)">
    <rect width="380" height="65" fill="#FFFFFF" stroke="#E0E6E0" stroke-width="1.5" />
    <!-- Nav item 1: Trilha (Active) -->
    <g transform="translate(48, 20)">
      <circle cx="0" cy="0" r="18" fill="#E8F5E9" />
      <text x="-9" y="7" font-size="18">🗺️</text>
    </g>
    <!-- Nav item 2: Dicionário -->
    <g transform="translate(142, 20)">
      <text x="-9" y="7" font-size="18">📖</text>
    </g>
    <!-- Nav item 3: Prática -->
    <g transform="translate(238, 20)">
      <text x="-9" y="7" font-size="18">🎯</text>
    </g>
    <!-- Nav item 4: Perfil -->
    <g transform="translate(332, 20)">
      <text x="-9" y="7" font-size="18">👤</text>
    </g>
  </g>
</svg>
