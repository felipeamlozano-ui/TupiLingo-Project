<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>TupiLingo — Carregando...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F3F2E8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #2D3748;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(208, 138, 69, 0.2);
      border-top-color: #D08A45;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      font-weight: 500;
      color: #718096;
    }
  </style>
  <script type="text/javascript">
    (function() {
      var pathname = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // Se a URL solicitada for dentro do subapp (/TupiLingo-Project/app/...)
      if (pathname.indexOf('/TupiLingo-Project/app') !== -1) {
        // Redireciona para a raiz do Flutter Web mantendo intactos todos os query params (ex: ?code=...) e hash
        var target = '/TupiLingo-Project/app/' + search + hash;
        window.location.replace(target);
      } else {
        // Redireciona para a raiz da landing page
        window.location.replace('/TupiLingo-Project/' + search + hash);
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>Carregando TupiLingo...</p>
</body>
</html>
