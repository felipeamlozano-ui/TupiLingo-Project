syntax = "proto3";

package tupilingo;

option go_package = "tupilingo/proto";
option java_package = "com.tupilingo.proto";

// ─── Perfil do Usuário ────────────────────────────────────────────────────────
message UserProfileMessage {
  string supabase_uid = 1;
  string email = 2;
  string name = 3;
  int32 xp_total = 4;
  int32 streak_dias = 5;
  int32 nivel_atual = 6;
  int32 conchas = 7;
  string variante_ativa_codigo = 8;
  string variante_ativa_nome = 9;
  bool ofensiva_ativa = 10;
}

// ─── Progresso de Lições do Usuário ──────────────────────────────────────────
message UserLessonProgressMessage {
  int32 licao_id = 1;
  int32 numero = 2;
  string titulo = 3;
  bool concluida = 4;
  int32 pontuacao_maxima = 5;
  int32 tentativas = 6;
  int64 data_conclusao_timestamp = 7; // Unix timestamp em segundos
}

// ─── Questão / Item de Quiz (Nivelamento / Prática) ──────────────────────────
message QuizItemMessage {
  int32 item_id = 1;
  string termo_tupi = 2;
  string traducao_correta = 3;
  repeated string distratores = 4;
  string regra_contexto = 5;
  string enunciado = 6;
  string explicacao = 7;
  string curiosidade = 8;
}

// ─── Bloco de Exercícios / Prova de Nivelamento ──────────────────────────────
message QuizBlockMessage {
  string quiz_id = 1;
  string variante_codigo = 2;
  int32 nivel = 3;
  string tema = 4;
  repeated QuizItemMessage questoes = 5;
  int64 gerado_em_timestamp = 6;
}

// ─── Envelopes Binários de Segurança e Developer Console (RFC-013 Enterprise) ─
message DeveloperCommandEnvelope {
  string command_id = 1;
  string action = 2;              // ex: "TOGGLE_FEATURE_FLAG", "FLUSH_CACHE"
  string target_key = 3;          // ex: "pindorama_particles_v2"
  bool bool_value = 4;
  int64 timestamp = 5;
  string nonce = 6;               // Anti-replay
  string session_token = 7;
  bytes signature = 8;
}

message AuthChallengeEnvelope {
  string email = 1;               // estritamente "felipe.a.m.lozano@gmail.com"
  string otp_code = 2;
  string master_passcode_hash = 3;
  int64 client_timestamp = 4;
  string client_nonce = 5;
}

message PresenceTelemetryEnvelope {
  string anonymous_session_id = 1;
  string country_code = 2;        // ex: "BR"
  string country_name = 3;        // ex: "Brasil"
  int64 ping_timestamp = 4;
}

message SecureBinaryPayload {
  string message_type = 1;        // "DeveloperCommand", "AuthChallenge", etc.
  bytes encrypted_payload = 2;   // Payload ofuscado/cifrado via C++ FFI
  bytes integrity_hmac = 3;      // Hash de integridade
  int32 epoch_window = 4;        // Janela de 30s
}

