# Ryzen 5 5500U -- 7.3 GB RAM total.
#
# HISTORICO DE CRASHES:
#   Xmx8G -> OOM fatal (hs_err_pid22096.log): 8G > RAM fisica
#   Xmx3G -> OOM fatal: Docker + WSL + IDE consomem ~7GB, restam <300MB para o Gradle
#
# SOLUCAO: o dev.bat para o Docker ANTES do build e reinicia depois.
# Com Docker parado, sobram ~3-4GB livres. Xmx2G e suficiente para compilar um APK release.
#
# Regra: Xmx <= RAM_livre_esperada_apos_parar_docker * 0.7
# ~3.5GB livres * 0.7 = ~2.4GB -> Xmx2G e seguro com margem.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# Limita workers paralelos para reduzir pico de memoria durante compilacao AOT
org.gradle.workers.max=2

# Mata daemon ocioso apos 2 minutos (evita acumulo de heap em idle)
org.gradle.daemon.idletimeout=120000

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
