<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="TupiLingo — Aprenda a língua Tupi de forma interativa, gamificada e com performance instantânea.">
  <meta name="theme-color" content="#F3F2E8">

  <!-- ─── Resource Hints & Preconnects (HPWE Camada 19) ──────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="preload" href="assets/shaders/mystic_aura.frag" as="fetch" crossorigin fetchpriority="high">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TupiLingo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TupiLingo — Gamified Indigenous Learning</title>
  <link rel="manifest" href="manifest.json">

  <!-- ─── In-Browser Performance Telemetry Hook (HPWE Camada 28) ──────────── -->
  <script>
    window.__tupiTelemetry = {
      longTasks: 0,
      maxLongTaskMs: 0,
      fcp: 0,
      lcp: 0
    };

    if ('PerformanceObserver' in window) {
      try {
        // Observador de Long Tasks (> 50ms)
        const longTaskObserver = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            window.__tupiTelemetry.longTasks++;
            if (entry.duration > window.__tupiTelemetry.maxLongTaskMs) {
              window.__tupiTelemetry.maxLongTaskMs = entry.duration;
            }
          }
        });
        longTaskObserver.observe({ entryTypes: ['longtask'] });

        // Observador de Paint (FCP)
        const paintObserver = new PerformanceObserver((list) => {
          for (const entry of list.getEntries()) {
            if (entry.name === 'first-contentful-paint') {
              window.__tupiTelemetry.fcp = entry.startTime;
            }
          }
        });
        paintObserver.observe({ entryTypes: ['paint'] });
      } catch (e) {
        // PerformanceObserver silenciado se não suportado
      }
    }

    // ─── Registro do Service Worker Enterprise (HPWE Camada 27) ───────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('tupi_service_worker.js')
          .then((reg) => console.log('⚡ [HPWE ServiceWorker] Registrado com sucesso:', reg.scope))
          .catch((err) => console.warn('[HPWE ServiceWorker] Erro ao registrar:', err));
      });
    }
  </script>
</head>
<body style="margin: 0; background-color: #F3F2E8; overflow: hidden;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
