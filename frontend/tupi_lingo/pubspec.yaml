name: tupi_lingo
description: "TupiLingo — Aprenda a língua Tupi Guarani de forma interativa e gamificada."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  # FLUTTER-004: .env removido dos assets — variáveis injetadas via dotenv em dev
  # Em produção, usar --dart-define no build. Flutter_dotenv usado apenas em dev.
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  ffi: ^2.2.0
  protobuf: ^6.0.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.7
  fixnum: ^1.1.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/google_logo.png
    # FLUTTER-004: .env REMOVIDO — não bundlar credenciais no APK/IPA

  shaders:
    - assets/shaders/mystic_aura.frag
    - assets/shaders/fog_of_war.frag
