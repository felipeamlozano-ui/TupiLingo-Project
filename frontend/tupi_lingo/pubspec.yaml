name: tupi_lingo
description: "TupiLingo — Aprenda a língua Tupi Guarani de forma interativa e gamificada."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.1
  # FLUTTER-004: .env removido dos assets — variáveis injetadas via dotenv em dev
  # Em produção, usar --dart-define no build. Flutter_dotenv usado apenas em dev.
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.4
  http: ^1.6.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  ffi: ^2.2.0
  protobuf: ^6.0.0
  flutter_secure_storage: ^11.0.0
  crypto: ^3.0.7
  fixnum: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/google_logo.png
    # FLUTTER-004: .env REMOVIDO — não bundlar credenciais no APK/IPA

  shaders:
    - assets/shaders/mystic_aura.frag
