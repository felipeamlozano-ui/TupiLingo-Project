<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="10" y="10" width="180" height="180" rx="48" fill="url(#bgGrad)" filter="url(#dropGlow)" />
  <rect x="12" y="12" width="176" height="176" rx="46" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Solar Radiance / Guaraní Sol Originário -->
  <circle cx="100" cy="100" r="48" fill="#FFF8E1" opacity="0.15" />
  
  <!-- Stylized Sun / Feather Crown (Cocar Sagrado) -->
  <path d="M100 32 L112 68 L100 62 L88 68 Z" fill="url(#goldGrad)" />
  <path d="M68 44 L90 74 L80 72 L62 58 Z" fill="#FFA000" />
  <path d="M132 44 L138 58 L120 72 L110 74 Z" fill="#FFA000" />
  
  <!-- Central Emblem: Native Arrow & Sprout (Semente & Flecha da Sabedoria) -->
  <path d="M100 64 C70 95 62 135 100 162 C138 135 130 95 100 64 Z" fill="#FFFFFF" />
  <path d="M100 74 C80 100 74 130 100 152 C126 130 120 100 100 74 Z" fill="url(#leafGrad)" />
  
  <!-- Central Sprout Vein / Golden Arrow -->
  <path d="M100 82 L100 144" stroke="#FFF9C4" stroke-width="4" stroke-linecap="round" />
  <path d="M100 104 Q114 96 116 88" stroke="#FFF9C4" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M100 118 Q86 110 84 102" stroke="#FFF9C4" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Cultural Dot Accents -->
  <circle cx="100" cy="62" r="5" fill="url(#goldGrad)" />
  <circle cx="68" cy="115" r="4" fill="url(#goldGrad)" />
  <circle cx="132" cy="115" r="4" fill="url(#goldGrad)" />
</svg>
